<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Pickcat 通知 · 开始使用</title>
<link rel="stylesheet" href="ui.css">
<style>
  body { padding: 30px 28px 26px; }
  .wrap { max-width: 660px; margin: 0 auto; }

  .hero { display: flex; align-items: flex-start; gap: 13px; }
  .hero img { width: 44px; height: 44px; border-radius: 11px; }
  h1 { margin: 0; font-size: 21px; font-weight: 650; letter-spacing: -.015em; }
  .lede { margin: 3px 0 0; color: var(--muted); font-size: 12.5px; }

  .steps { margin-top: 20px; padding: 4px 18px; }
  .step { display: flex; gap: 13px; padding: 13px 0; border-bottom: 1px solid var(--line-soft); }
  .step:last-child { border-bottom: none; }
  .idx {
    flex: none; width: 20px;
    color: var(--faint); font-size: 12px; font-weight: 600;
    font-variant-numeric: tabular-nums; padding-top: 1px;
  }
  .step-t { font-size: 13.5px; font-weight: 600; color: var(--ink); }
  .step-d { margin-top: 2px; color: var(--muted); font-size: 12px; line-height: 1.6; }

  .status { padding: 16px 18px; margin-top: 12px; }
  .status .cap { font-size: 11px; letter-spacing: .06em; color: var(--faint); margin-bottom: 8px; }
  .status-body { font-size: 12.5px; line-height: 1.95; color: var(--ink-2); }
  .status-body .k { color: var(--faint); margin-right: 7px; }
  .status-body b { font-weight: 600; }

  .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

  .note { margin-top: 12px; padding: 16px 18px; }
  .note .cap { font-size: 11px; letter-spacing: .06em; color: var(--faint); margin-bottom: 8px; }
  .note-body { font-size: 12px; line-height: 1.9; color: var(--muted); }
  .note-body b { color: var(--ink); font-weight: 600; }

  .byline { margin-top: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <img src="icons/icon128.png" alt="">
    <div>
      <h1>开始使用</h1>
      <p class="lede">关掉 Pickcat 网页后，它会在后台继续替你查新消息。</p>
    </div>
  </div>

  <div class="card steps">
    <div class="step">
      <div class="idx">01</div>
      <div>
        <div class="step-t">先登录 Pickcat</div>
        <div class="step-d">读到的是你自己账号的未读消息，没登录就读不到。</div>
      </div>
    </div>
    <div class="step">
      <div class="idx">02</div>
      <div>
        <div class="step-t">点一次「立即检查」</div>
        <div class="step-d">读到数字就通了；读不到会直接写明原因，不会含糊。</div>
      </div>
    </div>
    <div class="step">
      <div class="idx">03</div>
      <div>
        <div class="step-t">之后网页可以关掉</div>
        <div class="step-d">后台每分钟查一次，有新消息弹通知，写清谁赞了你、回复了什么。</div>
      </div>
    </div>
  </div>

  <div class="card status">
    <div class="cap">当前状态</div>
    <div class="status-body" id="status">正在读取…</div>
    <div class="btns">
      <button class="btn btn-primary" id="check">立即检查</button>
      <button class="btn btn-ghost" id="login">去登录 Pickcat</button>
      <button class="btn btn-ghost" id="close">知道了</button>
    </div>
  </div>

  <div class="card note">
    <div class="cap">能力边界</div>
    <div class="note-body">
      <b>关掉标签页：能收到。</b>检查由浏览器自己的定时任务驱动，与网页无关。<br>
      <b>关掉浏览器窗口、进程仍在后台：能。</b>需要打开 Chrome 的「关闭浏览器后继续运行后台应用」。<br>
      <b>完全退出浏览器：不能。</b>进程结束，插件随之停止。
    </div>
  </div>

  <div class="byline">
    <span>作者 <b>羽Yu</b></span>
    <span>只在本机读取，不保存密码</span>
  </div>
</div>
<script src="welcome.js"></script>
</body>
</html>
