<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="ui.css">
<style>
  body { width: 336px; }
  .wrap { padding: 14px 16px 10px; }

  header { display: flex; align-items: center; gap: 9px; }
  header img { width: 22px; height: 22px; border-radius: 7px; }
  .brand-name { font-size: 13.5px; font-weight: 650; letter-spacing: -.01em; }
  .brand-sub { font-size: 11px; color: var(--faint); margin-top: -1px; }
  .push { margin-left: auto; }

  .stat {
    margin-top: 12px;
    padding: 13px 14px 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-card);
  }
  .stat-line { display: flex; align-items: baseline; gap: 5px; }
  .stat-num { font-size: 31px; font-weight: 650; letter-spacing: -.035em; line-height: 1.05; }
  .stat-unit { font-size: 12px; color: var(--muted); }
  .stat-tag {
    margin-left: auto;
    padding: 2px 8px;
    border-radius: var(--r-chip);
    background: var(--bg);
    color: var(--muted);
    font-size: 11px;
    white-space: nowrap;
  }
  .stat-tag.bad { color: var(--signal); background: transparent; border: 1px solid currentColor; }
  .stat-meta { margin-top: 6px; color: var(--faint); font-size: 11.5px; }
  .stat-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .chip {
    padding: 1px 7px;
    border-radius: var(--r-chip);
    background: var(--surface-2);
    color: var(--ink-2);
    font-size: 11px;
  }
  .stat-err { margin-top: 7px; color: var(--signal); font-size: 11.5px; line-height: 1.5; }

  .feed-head { display: flex; justify-content: space-between; align-items: center; margin: 12px 0 3px; }
  .feed-head span { font-size: 11px; color: var(--faint); letter-spacing: .06em; }
  .feed-head a { font-size: 11px; color: var(--muted); text-decoration: none; cursor: pointer; }
  .feed-head a:hover { color: var(--ink); }

  .feed-item {
    display: flex; gap: 9px; align-items: flex-start;
    padding: 7px 8px; margin: 0 -8px;
    border-radius: var(--r-ctl);
    cursor: pointer;
    transition: background .12s;
  }
  .feed-item:hover { background: var(--surface-2); }
  .ava {
    flex: none;
    width: 22px; height: 22px; margin-top: 1px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--ink-2);
    font-size: 10px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .ava img { width: 100%; height: 100%; object-fit: cover; }
  .item-main { min-width: 0; flex: 1; }
  .item-t { font-size: 12px; line-height: 1.45; color: var(--ink-2); }
  .item-t b { color: var(--ink); font-weight: 600; }
  .item-d {
    font-size: 11px; color: var(--faint); line-height: 1.4;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .item-go { flex: none; align-self: center; color: var(--faint); opacity: 0; transition: opacity .12s; }
  .feed-item:hover .item-go { opacity: 1; }
  .empty { color: var(--faint); font-size: 11.5px; padding: 5px 0 2px; }

  .ctl {
    display: flex; align-items: center; gap: 8px;
    margin-top: 11px; padding-top: 11px;
    border-top: 1px solid var(--line-soft);
  }
  .ctl label { font-size: 12px; color: var(--muted); }
  .ctl .seg { margin-left: auto; }
  .dnd-hint { margin-top: 6px; font-size: 11px; color: var(--faint); }

  .acts { display: flex; gap: 8px; margin-top: 9px; }
  .acts .btn { flex: 1; }
  .acts .btn-sm { flex: none; padding: 0 11px; font-size: 12px; }

  .more {
    display: flex; align-items: center; justify-content: center; gap: 4px;
    width: 100%; height: 30px; margin-top: 6px;
    border: none; background: none; color: var(--faint);
    font-size: 11.5px; font-family: inherit; cursor: pointer;
  }
  .more:hover { color: var(--ink-2); }

  .foot { margin-top: 2px; text-align: center; font-size: 10.5px; color: var(--faint); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="icons/icon32.png" alt="">
    <div>
      <div class="brand-name">Pickcat 通知</div>
      <div class="brand-sub">关掉网页也能收到</div>
    </div>
    <div class="switch on push" id="sw" title="总开关"><div class="knob"></div></div>
  </header>

  <div class="stat">
    <div class="stat-line">
      <div class="stat-num num" id="unread">0</div>
      <div class="stat-unit">条未读</div>
      <div class="stat-tag" id="tag">—</div>
    </div>
    <div class="stat-meta" id="meta">还没检查过</div>
    <div class="stat-chips" id="chips"></div>
    <div class="stat-err" id="err"></div>
  </div>

  <div class="feed-head">
    <span>最新动态</span>
    <a id="all">查看全部</a>
  </div>
  <div id="list"></div>

  <div class="ctl">
    <label>多久查一次</label>
    <div class="seg" id="intervalSeg">
      <button type="button" data-v="1">1 分钟</button>
      <button type="button" data-v="2">2 分钟</button>
      <button type="button" data-v="5">5 分钟</button>
    </div>
  </div>
  <div class="dnd-hint" id="dnd"></div>

  <div class="acts">
    <button class="btn btn-primary" id="check">立即检查</button>
    <button class="btn btn-ghost btn-sm" id="readAll" title="把账号里的通知全部标为已读">全部已读</button>
  </div>

  <button class="more" id="more">更多设置
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
  </button>

  <div class="foot" id="foot">v2.4.0 · 作者 羽Yu</div>
</div>
<script src="popup.js"></script>
</body>
</html>
