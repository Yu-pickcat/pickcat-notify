<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="ui.css">
<style>
  body { width: 320px; }
  .wrap { padding: 14px 16px 12px; }

  header { display: flex; align-items: center; gap: 9px; }
  header img { width: 20px; height: 20px; border-radius: 6px; }
  .brand-name { font-size: 13.5px; font-weight: 650; letter-spacing: -.01em; }
  .brand-sub { font-size: 11px; color: var(--faint); margin-top: -1px; }
  .push { margin-left: auto; }

  .stat {
    margin-top: 12px;
    padding: 13px 14px 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-card);
  }
  .stat-line { display: flex; align-items: baseline; gap: 5px; }
  .stat-num { font-size: 30px; font-weight: 650; letter-spacing: -.03em; line-height: 1.1; }
  .stat-unit { font-size: 12px; color: var(--muted); }
  .stat-tag {
    margin-left: auto;
    padding: 2px 7px;
    border-radius: var(--r-chip);
    background: var(--bg);
    color: var(--muted);
    font-size: 11px;
  }
  .stat-meta { margin-top: 5px; color: var(--faint); font-size: 11.5px; }
  .stat-err { margin-top: 5px; color: var(--signal); font-size: 11.5px; line-height: 1.5; }

  .feed { margin-top: 10px; border-top: 1px solid var(--line-soft); padding-top: 9px; }
  .feed:first-child { border-top: none; padding-top: 0; }
  .feed-item { display: flex; gap: 8px; padding: 5px 0; }
  .ava {
    flex: none;
    width: 20px; height: 20px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--ink-2);
    font-size: 10px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .ava img { width: 100%; height: 100%; object-fit: cover; }
  .item-main { min-width: 0; flex: 1; }
  .item-t { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; font-size: 12px; line-height: 1.45; color: var(--ink-2); }
  .item-t b { color: var(--ink); font-weight: 600; }
  .item-t .cat {
    flex: none; padding: 1px 6px;
    border: 1px solid var(--line); border-radius: var(--r-chip);
    background: var(--bg); color: var(--muted);
    font-size: 10px; line-height: 1.5;
  }
  .item-meta { margin-top: 1px; font-size: 10.5px; color: var(--faint); }
  .item-d {
    font-size: 11px; color: var(--faint); line-height: 1.4;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .empty { color: var(--faint); font-size: 11.5px; padding: 3px 0 1px; }
  .feed-head { display: flex; justify-content: space-between; align-items: center; margin: 11px 0 2px; }
  .feed-head span { font-size: 11px; color: var(--faint); letter-spacing: .06em; }
  .feed-head a { font-size: 11px; color: var(--muted); text-decoration: none; cursor: pointer; }
  .feed-head a:hover { color: var(--ink); }

  .ctl {
    display: flex; align-items: center; gap: 8px;
    margin-top: 12px; padding-top: 11px;
    border-top: 1px solid var(--line-soft);
  }
  .ctl label { font-size: 12px; color: var(--muted); }
  .ctl .seg { margin-left: auto; }

  .acts { display: flex; gap: 8px; margin-top: 9px; }
  .acts .btn { flex: 1; }

  .more {
    display: flex; align-items: center; justify-content: center; gap: 4px;
    width: 100%; height: 30px; margin-top: 6px;
    border: none; background: none; color: var(--faint);
    font-size: 11.5px; font-family: inherit; cursor: pointer;
  }
  .more:hover { color: var(--ink-2); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="icons/icon32.png" alt="">
    <div>
      <div class="brand-name">Pickcat 通知</div>
      <div class="brand-sub">关掉网页也能收到 · <span id="ver">V2.4.4 beta</span></div>
    </div>
    <div class="switch on push" id="sw"><div class="knob"></div></div>
  </header>

  <div class="stat">
    <div class="stat-line">
      <div class="stat-num num" id="unread">0</div>
      <div class="stat-unit">条未读</div>
      <div class="stat-tag" id="tag">—</div>
    </div>
    <div class="stat-meta" id="meta">还没检查过</div>
    <div class="stat-err" id="err"></div>
  </div>

  <div class="feed-head">
    <span>最新动态</span>
    <a id="all">查看全部</a>
  </div>
  <div id="list"></div>

  <div class="ctl">
    <label>多久查一次</label>
    <div class="seg" id="intervalSeg">
      <button type="button" data-v="0.5">30 秒</button>
      <button type="button" data-v="1">1 分钟</button>
      <button type="button" data-v="3">3 分钟</button>
      <button type="button" data-v="5">5 分钟</button>
      <button type="button" data-v="10">10 分钟</button>
    </div>
  </div>

  <div class="acts">
    <button class="btn btn-primary" id="check">立即检查</button>
    <button class="btn btn-ghost" id="markAll">全部已读</button>
  </div>

  <button class="more" id="more">更多设置
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
  </button>
</div>
<script src="popup.js"></script>
</body>
</html>
