<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="ui.css">
<script src="shell.js"></script>
<style>
  body { width: var(--pw, 340px); }
  .wrap { padding: 13px 15px 11px; }

  header { display: flex; align-items: center; gap: 9px; }
  header img {
    width: 26px; height: 26px; border-radius: var(--r-icon-s);
    border: 1px solid var(--glass-border);
    background: var(--surface-2);
  }
  .brand-name { font-size: 14.5px; font-weight: 650; letter-spacing: -.01em; }
  .brand-sub { font-size: 11px; color: var(--faint); margin-top: -2px; }
  .push { margin-left: auto; }

  .stat {
    position: relative;
    isolation: isolate;
    margin-top: 11px;
    padding: 10px 12px 10px;
    border: 1px solid var(--glass-border);
    border-radius: var(--r-card);
    background: var(--surface);
    overflow: hidden;
  }
  .stat-line { position: relative; display: flex; align-items: baseline; gap: 5px; }
  .stat-num {
    font-size: 30px; font-weight: 700; letter-spacing: -.035em; line-height: 1.02;
    color: var(--ink); font-variant-numeric: tabular-nums;
  }
  .stat-num.hot { color: var(--brand); }
  .stat-unit { font-size: 12px; color: var(--muted); }
  .stat-tag {
    margin-left: auto;
    padding: 3px 9px;
    border-radius: var(--r-chip);
    background: var(--surface-2);
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    line-height: 1.5;
    border: 1px solid var(--line);
    white-space: nowrap;
  }
  .stat-tag.on { background: var(--brand-soft); border-color: rgba(240, 51, 44, .26); color: var(--signal); }
  .stat-tag.ok { background: rgba(35, 170, 100, .12); border-color: rgba(35, 170, 100, .3); color: var(--ok); }
  .stat-tag.warn { background: rgba(220, 160, 40, .13); border-color: rgba(220, 160, 40, .32); color: #b4820f; }
  .stat-meta { position: relative; margin-top: 6px; color: var(--faint); font-size: 11.5px; }
  .stat-err { position: relative; margin-top: 5px; color: var(--signal); font-size: 11.5px; line-height: 1.5; }

  .feed-head { display: flex; justify-content: space-between; align-items: center; margin: 14px 0 7px; }
  .feed-head span { font-size: 11.5px; color: var(--ink-2); font-weight: 600; letter-spacing: .01em; }
  .feed-head span::before {
    content: ""; display: inline-block; width: 3px; height: 11px; margin-right: 6px;
    border-radius: 2px; background: var(--brand-grad); vertical-align: -1px;
  }
  .feed-head a { font-size: 11px; color: var(--muted); text-decoration: none; cursor: pointer; transition: color .16s var(--ease); }
  .feed-head a:hover { color: var(--brand); }

  .chips { display: flex; gap: 5px; flex-wrap: wrap; margin: 0 0 7px; }

  #list { margin-top: 2px; max-height: 132px; overflow-y: auto; overflow-x: hidden; padding: 0 3px; }
  #list::-webkit-scrollbar { width: 4px; }
  #list::-webkit-scrollbar-thumb { background: var(--scroll); border: 0; border-radius: 999px; }
  .feed-item {
    display: flex; gap: 8px; padding: 7px 6px;
    border-radius: var(--r-ctl); margin: 0 -3px 1px;
    transition: background .16s var(--ease), transform .18s var(--spring);
  }
  .feed-item:hover { background: var(--surface-2); }
  .feed-item:active { transform: scale(.995); }
  .feed-item.clickable { cursor: pointer; }
  .item-main { min-width: 0; flex: 1; }
  .item-t { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; font-size: 12px; line-height: 1.5; color: var(--ink-2); }
  .item-t b { color: var(--ink); font-weight: 600; }
  .item-t .cat {
    flex: none; padding: 1px 8px;
    border: 1px solid var(--line); border-radius: var(--r-chip);
    background: var(--surface-2); color: var(--faint);
    font-size: 10px; line-height: 1.6;
  }
  .item-meta { margin-top: 2px; font-size: 10.5px; color: var(--faint); }
  .item-d {
    font-size: 11px; color: var(--faint); line-height: 1.45;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .empty { color: var(--faint); font-size: 11.5px; padding: 8px 0 6px; }
  .empty .go {
    display: inline-block; margin-top: 5px; padding: 0;
    border: 0; background: none; color: var(--brand);
    font-family: inherit; font-size: 11.5px; cursor: pointer;
  }

  .ctl {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-top: 11px; padding-top: 11px;
    border-top: 1px solid var(--line-soft);
  }
  .ctl label { font-size: 11.5px; color: var(--muted); }

  .acts { display: flex; gap: 8px; margin-top: 9px; }
  .acts .btn { flex: 1; }

  .more {
    display: flex; align-items: center; justify-content: center; gap: 4px;
    width: 100%; height: 30px; margin-top: 5px;
    border: none; background: none; color: var(--faint);
    border-radius: var(--r-ctl);
    font-size: 11.5px; font-family: inherit; cursor: pointer;
    transition: color .16s var(--ease), background .16s var(--ease);
  }
  .more:hover { color: var(--brand); background: var(--surface-2); }

  .upd {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 2px; color: var(--faint); font-size: 11px;
  }
  .upd a { color: var(--muted); text-decoration: none; cursor: pointer; transition: color .16s var(--ease); }
  .upd a:hover { color: var(--brand); }
  .upd a.new { color: var(--brand); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="icons/mark.svg" alt="">
    <div>
      <div class="brand-name">pickcat 通知</div>
      <div class="brand-sub">关掉网页也能收到 · <span id="ver"></span></div>
    </div>
    <div class="switch on push" id="sw"><div class="knob"></div></div>
  </header>

  <div class="stat">
    <div class="stat-line">
      <div class="stat-num tnum" id="unread">0</div>
      <div class="stat-unit">条未读</div>
      <div class="stat-tag" id="tag">—</div>
    </div>
    <div class="stat-meta" id="meta">还没检查过</div>
    <div class="stat-err" id="err"></div>
  </div>

  <div class="feed-head">
    <span>最新动态</span>
    <a id="all">消息中心</a>
  </div>

  <div class="chips" id="chips">
    <button type="button" class="chip on" data-f="all" data-label="全部">全部</button>
    <button type="button" class="chip" data-f="mention" data-label="@我">@我</button>
    <button type="button" class="chip" data-f="reply" data-label="回复">回复</button>
    <button type="button" class="chip" data-f="like" data-label="赞">赞</button>
    <button type="button" class="chip" data-f="follow" data-label="关注">关注</button>
    <button type="button" class="chip" data-f="system" data-label="系统">系统</button>
  </div>

  <div id="list"></div>

  <div class="ctl">
    <label>Pickcat 网页换肤</label>
    <div class="switch" id="swSkin"><div class="knob"></div></div>
  </div>

  <div class="acts">
    <button class="btn btn-primary" id="check">立即检查</button>
    <button class="btn btn-ghost" id="markAll">全部已读</button>
  </div>

  <button class="more" id="more">更多设置
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
  </button>

  <div class="upd">
    <span id="updText">解压安装不会自动更新</span>
    <a id="updDo">检查更新</a>
  </div>
</div>
<script src="popup.js"></script>
</body>
</html>
