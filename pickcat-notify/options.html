<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Pickcat 通知 · 设置</title>
<link rel="stylesheet" href="ui.css">
<style>
  body { padding: 28px 24px 32px; }
  .wrap { max-width: 600px; margin: 0 auto; }

  header { display: flex; align-items: center; gap: 11px; margin-bottom: 20px; }
  header img { width: 30px; height: 30px; border-radius: 8px; }
  h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
  .sub { color: var(--faint); font-size: 11.5px; margin-top: 1px; }

  .card { padding: 16px 18px; margin-bottom: 12px; }

  .diag { font-size: 12px; line-height: 1.95; color: var(--ink-2); }
  .diag .k { color: var(--faint); margin-right: 7px; }
  .diag b { font-weight: 600; }

  .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

  .note { font-size: 12px; line-height: 1.85; color: var(--muted); }
  .note b { color: var(--ink); font-weight: 600; }

  .dnd { display: none; align-items: center; gap: 8px; padding: 0 0 11px; color: var(--muted); font-size: 12px; }
  .dnd.show { display: flex; }

  .foot { margin-top: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="icons/icon48.png" alt="">
    <div>
      <h1>设置</h1>
      <div class="sub">Pickcat 通知助手</div>
    </div>
  </header>

  <div class="card">
    <div class="sec-title">检查</div>
    <div class="row">
      <div>
        <div class="row-label">多久查一次</div>
        <div class="row-desc">间隔越短越及时，也越费流量</div>
      </div>
      <div class="seg" id="intervalSeg">
        <button type="button" data-v="1">1 分钟</button>
        <button type="button" data-v="2">2 分钟</button>
        <button type="button" data-v="5">5 分钟</button>
      </div>
    </div>
    <div class="row">
      <div>
        <div class="row-label">检查方式</div>
        <div class="row-desc" id="modeDesc">智能：先直连接口，读不到再用后台页面</div>
      </div>
      <div class="seg" id="modeSeg">
        <button type="button" data-v="smart">智能</button>
        <button type="button" data-v="direct">只直连</button>
        <button type="button" data-v="window">只用后台页面</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="sec-title">提醒</div>
    <div class="row">
      <div>
        <div class="row-label">桌面通知</div>
        <div class="row-desc">显示谁赞了你、回复了什么</div>
      </div>
      <div class="switch" id="swNotify"><div class="knob"></div></div>
    </div>
    <div class="row">
      <div class="row-label">图标上显示未读数</div>
      <div class="switch" id="swBadge"><div class="knob"></div></div>
    </div>
    <div class="row">
      <div class="row-label">通知带提示音</div>
      <div class="switch" id="swSound"><div class="knob"></div></div>
    </div>
    <div class="row">
      <div class="row-label">点通知打开消息中心</div>
      <div class="switch" id="swOpen"><div class="knob"></div></div>
    </div>
    <div class="row">
      <div class="row-label">免打扰时段</div>
      <div class="switch" id="swDnd"><div class="knob"></div></div>
    </div>
    <div class="dnd" id="dndBox">
      <input type="time" id="dndStart"><span>到</span><input type="time" id="dndEnd"><span>不弹通知</span>
    </div>
  </div>

  <div class="card">
    <div class="sec-title">后台体检</div>
    <div class="diag" id="diag">读取中…</div>
    <div class="btns">
      <button class="btn btn-ghost" id="checkNow">立即检查</button>
      <button class="btn btn-ghost" id="openSite">打开 Pickcat</button>
      <button class="btn btn-ghost" id="openWelcome">查看引导页</button>
      <button class="btn btn-danger" id="closeHelper">关掉后台页面</button>
    </div>
    <div class="tail">
      <button class="mini" id="test">发一条测试通知</button>
    </div>
  </div>

  <div class="card">
    <div class="sec-title">关掉网页还能收到吗</div>
    <div class="note">
      <b>关掉 Pickcat 标签页：能。</b>检查跑在浏览器自己的定时任务里，跟网页开没开无关。<br>
      <b>关掉浏览器窗口、进程还在后台：能。</b>要在 Chrome 设置里打开「关闭浏览器后继续运行后台应用」。<br>
      <b>完全退出浏览器：不能。</b>浏览器进程没了，插件也停。
    </div>
    <div class="btns">
      <button class="btn btn-ghost" id="closedTest">关掉所有 Pickcat 页面后测试</button>
    </div>
  </div>

  <div class="byline foot">
    <span>作者 <b>羽Yu</b></span>
    <span>只在本机读取，不保存密码</span>
  </div>
</div>
<script src="options.js"></script>
</body>
</html>
